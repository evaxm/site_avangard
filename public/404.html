<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, follow">
  <title>Страница не найдена | Авангард</title>
  <style>
    :root{color-scheme:light;--ink:#142126;--paper:#f7f3eb;--blue:#2859ff;--lime:#dfff43}*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;padding:24px;background-color:var(--paper);background-image:linear-gradient(rgba(20,33,38,.055) 1px,transparent 1px),linear-gradient(90deg,rgba(20,33,38,.055) 1px,transparent 1px);background-size:40px 40px;color:var(--ink);font-family:Arial,sans-serif}.card{width:min(760px,100%);padding:clamp(32px,7vw,72px);border:2px solid var(--ink);border-radius:38px;background:#fff;box-shadow:18px 18px 0 #20c5bc}.code{font:700 16px monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--blue)}h1{margin:24px 0 16px;font-size:clamp(42px,9vw,84px);font-weight:500;line-height:.95}p{max-width:560px;margin:0 0 34px;color:#607078;font-size:clamp(18px,3vw,24px);line-height:1.45}a{display:inline-flex;align-items:center;gap:28px;padding:20px 28px;border-radius:18px;background:var(--lime);color:var(--ink);font-weight:800;text-decoration:none}a:focus-visible{outline:3px solid var(--blue);outline-offset:4px}
  </style>
</head>
<body>
  <main class="card">
    <span class="code">Ошибка 404</span>
    <h1>Страница не найдена</h1>
    <p>Возможно, адрес изменился или в ссылке есть ошибка.</p>
    <a href="/">Вернуться на главную <span aria-hidden="true">→</span></a>
  </main>
</body>
</html>
